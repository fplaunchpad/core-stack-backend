server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths load index.html and React routes them.
    location / {
        try_files $uri $uri/ @spa;
    }

    # index.html names the current JS bundle. Never cache it, or browsers keep
    # running the old site after a rebuild. It is served by these three blocks:
    # the home page, the file itself, and app routes such as /kyl_dashboard.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location @spa {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Built JS/CSS have content hashes in their names, so cache them long.
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
